          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SylvaWorkloadClusterSpec defines the desired state of SylvaWorkloadCluster
            properties:
              clusterSettings:
                description: |-
                  ClusterSettings is a free-form JSON that holds specific settings for the cluster.
                  This field will be mapped to SylvaUnitsRelease.spec.values.cluster.
                  Note well that it can't hold sylva-units templated values (strings with '{{ ... }}')
                x-kubernetes-preserve-unknown-fields: true
              controlPlane:
                properties:
                  provider:
                    description: |-
                      Provider specifies how Kubernetes base components are deployed: "kubeadm" for
                      Kubeadm ("cabpk" CAPI provider), "rke2" for Rancher RKE2.
                    enum:
                    - rke2
                    - kubeadm
                    type: string
                  replicas:
                    description: Number of control plane nodes
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - provider
                type: object
              enabledUnits:
                additionalProperties:
                  type: boolean
                description: |-
                  Defines the units to be enabled in the workload cluster.
                  Each unit is represented as a key in this object with a boolean value indicating its enabled status.
                type: object
              infrastructure:
                description: |-
                  Infrastructure specifies the underlying infrastructure provider for the cluster.
                  Supported values and their corresponding Cluster API Providers:
                  "openstack" maps to the Cluster API Provider OpenStack (capo),
                  "vsphere" maps to the Cluster API Provider vSphere (capv),
                  "docker" maps to the Cluster API Provider Docker (capd),
                  "metal3" maps to the Cluster API Provider Metal3 (capm3).
                enum:
                - openstack
                - docker
                - vsphere
                - metal3
                type: string
              k8sVersion:
                description: |-
                  Kubernetes version for the cluster, e.g. "1.27".
                  Note that this is *not* a full version, but only the two first numbers.
                pattern: ^[1-9]+[0-9]*[.]([1-9]+[0-9]|0)+$
                type: string
              machineDeployments:
                additionalProperties:
                  description: MachineDeploymentSpec defines sets of cluster nodes
                    (implemented with Cluster API Machine Deployments)
                  properties:
                    replicas:
                      format: int32
                      type: integer
                  required:
                  - replicas
                  type: object
                type: object
              secretValues:
                description: |-
                  SecretValues define the (relative) path to a JSON secret and the key, stored in the Sylva secret storage (ex: /secret/data/${current namespace}/${SecretValues.path}/${SecretValues.key} in Vault).
                  This field will be mapped to SylvaUnitsRelease.spec.values.clusterSecrets.
                properties:
                  key:
                    type: string
                  path:
                    type: string
                type: object
              suspend:
                default: false
                description: Suspend tells the controller to suspend reconciliation
                  for this SylvaUnitsRelease,
                type: boolean
            required:
            - controlPlane
            - infrastructure
            - machineDeployments
            type: object
          status:
            default:
              observedGeneration: -1
            description: SylvaWorkloadClusterStatus defines the observed state of
              SylvaWorkloadCluster
            properties:
              conditions:
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the last observed generation.
                format: int64
                type: integer
            type: object

  names:
    kind: SylvaWorkloadCluster
    listKind: SylvaWorkloadClusterList
    plural: sylvaworkloadclusters
    shortNames:
    - swc
    singular: sylvaworkloadcluster
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SylvaWorkloadCluster is the Schema for the sylvaworkloadclusters
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.

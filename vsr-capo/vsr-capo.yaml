kind: SylvaWorkloadCluster
apiVersion: workloadclusteroperator.sylva/v1alpha1
metadata:
  name: vsr
  namespace: vsr-capo
spec:
  k8sVersion: "1.31"
  sylvaSourceVersion:
    branch: main
  infrastructure: openstack
  controlPlane:
    provider: rke2
    replicas: 1
  machineDeployments:
    md1:
      replicas: 0
  valuesFrom:
  - type: ExternalSecret
    name: sylva-secret
    valuesKey: secrets
  overridingValues:
    security:
      os_images:
        skip_signing_check: true
    openstack:
      storageClass:
        type: "sylva-volume"
    proxies:
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
  enabledUnits:
    multus: true
    sriov-crd: true
    sriov-resources: true
    sriov: true
  clusterSettings:
    name: vsr-capo
    capo:
      resources_tag: rke2-capo
      ssh_key_name: sylva-deployer
      network_id: cb21c2ea-5cd3-48fd-966c-7679b1b9f269
      flavor_name: "m1.xlarge"
      os_image_selector:
        os: ubuntu
        hardened: true
      rootVolume:
        diskSize: 160
        volumeType: sylva-volume
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sylva-secret
  namespace: vsr-capo
spec:
  data:
  - secretKey: secrets
    remoteRef:
      key: secret/vsr-capo/wc/capo
  refreshInterval: 10m
  secretStoreRef:
    kind: SecretStore
    name: vsr-capo
  target:
    name: sylva-secret

---
sylva_diskimagebuilder_images:
  ubuntu-jammy-hardened-rke2-1-30-7:
    enabled: true

cluster:
  control_plane_replicas: 1
  name: management-capo
  capi_providers:
    infra_provider: capo
    bootstrap_provider: cabpr

  capo:
    image_key: ubuntu-jammy-hardened-rke2-1-30-7  # OpenStack Glance image (key of image in sylva_diskimagebuilder_images/os_images)
    ssh_key_name: sylva-capd # OpenStack Nova SSH keypair is provided by runner context in CI
    network_id: 3dc41d4d-c67b-432f-a75b-b503d0ccdcc1 # OpenStack Neutron network id is provided by runner context in CI
    flavor_name: "m1.xlarge"

  machine_deployments:
    md0:
      replicas: 0
      capo:
        failure_domain: region0

openstack:
  storageClass:
    # name: "cinder-ceph-ssd"
    type: "my-cinder-volume-type"

proxies:
  # put your own proxy settings here if you need
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

units:
  cinder-csi:
    enabled: false
  thanos:
    enabled: false
  logging:
    enabled: false
  kubevirt:
    enabled: false
  harbor:
    enabled: false
  monitoring:
    enabled: false
  flux-webui:
    enabled: true
  capd:
    enabled: true
  minio-monitoring:
    enabled: false
  keycloak:
    enabled: false


workload_clusters:
  sylva_source:
    type: git
    url: https://gitlab.com/sylva-projects/sylva-core.git
    tag: 1.3.0
  teams:
    wc-test:
      kustomization_spec:
        interval: 15m
      gitrepository_spec:
        url: https://github.com/luisvega23/sylva-integration-test
        ref:
          branch: test-wco
        interval: 5m
      gitrepository_path: "./whitestack-capo-test"

# configure containerd registry mirrors following https://github.com/containerd/containerd/blob/main/docs/hosts.md
# see charts/syla-units/values.yaml for a more detailled example
# registry_mirrors:
#   hosts_config:
#     docker.io:
#     - mirror_url: http://your.mirror/docker

# add ntp servers if you need
ntp:
  enabled: false
  servers:
  # - 1.2.3.4
  # - 1.2.3.5

